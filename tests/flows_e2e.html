<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout Flow</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 2rem;
            width: 100%;
            max-width: 480px;
        }
        .toast {
            position: fixed; top: 1rem; right: 1rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }
        .toast.success { background: #16a34a; }
        .toast.failed  { background: #dc2626; }
        .toast.show    { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>
    <div id="successToast" class="toast success">
        <span>The payment was successful</span>
    </div>
    <div id="failedToast" class="toast failed">
        <span>The payment failed, try again</span>
    </div>

    <form>
        <div class="container">
            <div id="flow-container"></div>
        </div>
        <span id="error-message"></span>
    </form>

    <script>
        window._capturedLogs = [];
        const originalError = console.error;
        const originalWarn = console.warn;
        console.error = function(...args) { window._capturedLogs.push("ERROR: " + args.join(" ")); originalError.apply(console, args); };
        console.warn = function(...args) { window._capturedLogs.push("WARN: " + args.join(" ")); originalWarn.apply(console, args); };
        window.addEventListener('unhandledrejection', function(event) {
            window._capturedLogs.push("REJECTION: " + JSON.stringify(event.reason, Object.getOwnPropertyNames(event.reason)));
        });
    </script>
    <script src="https://checkout-web-components.checkout.com/index.js"></script>
    <script>
        // E2E test helpers
        window.focusCardholderName = function() {
            let el = document.querySelector('input[name="cardholderName"], input[id="cardholderName"], input[autocomplete="cc-name"], iframe[data-testid*="cardholder"]');
            if(el) el.focus();
        };
        window.focusCardNumber = function() {
            let el = document.querySelector("iframe[data-testid='card-number']");
            if(el) el.focus();
        };
        window.focusCardExpiry = function() {
            let el = document.querySelector("iframe[data-testid='card-expiry-date']");
            if(el) el.focus();
        };
        window.focusCardCvv = function() {
            let el = document.querySelector("iframe[data-testid='card-cvv']");
            if(el) el.focus();
        };
        window.preparePayButton = function() {
            let b = Array.from(document.querySelectorAll('button')).find(btn => btn.textContent.includes('Pay') || btn.innerText.includes('Pay')); 
            if(b) { 
                b.id = 'checkout-pay-button'; 
                b.scrollIntoView({block: 'center'}); 
            } else { 
                console.error('Pay button not found'); 
            }
        };
        window.getBodyText = function() {
            return document.body.innerText;
        };
        window.getCapturedLogs = function() {
            return window._capturedLogs ? JSON.stringify(window._capturedLogs) : '[]';
        };
    </script>
    <script>
        (async () => {
            try {
                console.warn("Starting initialization");
                const publicKey  = '__PUBLIC_KEY__';
                const paymentSession = __PAYMENT_SESSION_JSON__;
    
                const checkout = await CheckoutWebComponents({
                    paymentSession,
                    publicKey,
                    environment: 'sandbox',
                    onPaymentCompleted: function(_component, paymentResponse) {
                        console.warn("Payment completed: " + JSON.stringify(paymentResponse));
                        document.body.innerText = 'Payment complete';
                        document.getElementById('successToast').classList.add('show');
                    },
                    onPaymentFailed: function(_component, error) {
                        console.error("Payment failed: " + JSON.stringify(error));
                        document.body.innerText = 'Payment failed';
                        document.getElementById('failedToast').classList.add('show');
                    },
                });
                
                console.warn("Checkout component initialized");
    
                const flow = checkout.create('flow');
                flow.mount('#flow-container');
                console.warn("Flow mounted");
            } catch (err) {
                console.error("Mount error: " + err.message + "\n" + err.stack);
            }
        })();
    </script>
</body>
</html>
